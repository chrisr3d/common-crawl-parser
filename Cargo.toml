[package]
name = "cc-extract"
version = "2.0.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
futures = "0.3"
libflate = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
memchr = "2"       # SIMD-accelerated byte/substring search (ripgrep's core technique)
memmap2 = "0.9"    # memory-mapped file I/O for zero-copy parsing
flate2 = { version = "1", features = ["zlib-ng"], default-features = false }  # SIMD-optimized gzip via zlib-ng
sha2 = "0.11"      # SHA-256, the key inline favicons are saved under
sha3 = "0.12"      # SHA3-256, the checksum inside v3 onion addresses

# Only for examples, tests and benchmarks: never compiled into the library or
# the binary. `warc` powers `examples/baseline.rs`, the original parser kept
# as a speed and count yardstick.
[dev-dependencies]
warc = "0.4"

# Optimize all dependencies even in debug builds.
# Our code (gzip decompression, regex) spends 99% of CPU time inside
# dependency crates. Optimizing them gives release-like performance
# while keeping our own code in debug mode (fast compile, good errors).
[profile.dev.package."*"]
opt-level = 2
